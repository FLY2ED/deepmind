[project]
name = "takethecall"
version = "0.1.0"
description = "TakeTheCall (대신받아) — Real-Time Voice Phishing Active Defense Agent powered by Gemini 3.8 Live & Gemini 4 Argon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.30.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
